<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>ArqStudio 3D</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="top-row">
        <!-- Panel izquierdo: herramientas -->
        <div id="left-toolbar"></div>

        <!-- Viewport 3D central -->
        <div id="viewport-container">
          <canvas id="viewport-canvas"></canvas>
          <div id="viewport-label">Interactive 3D Workspace</div>
          <div id="orientation-gizmo"></div>
          <div id="navigation-sphere"></div>
          <div id="zoom-bar">
            <span>−</span>
            <input id="zoom-slider" type="range" min="0" max="1" step="0.01" value="0.4" />
            <span>+</span>
          </div>
        </div>

        <!-- Panel derecho: instrucciones + Chat IA -->
        <div id="right-panel"></div>
      </div>

      <!-- Galería inferior -->
      <div id="bottom-gallery"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
